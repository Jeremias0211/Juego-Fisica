<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misión 2D · Nuevo Hogar</title>
  <link rel="stylesheet" href="../css/Juego.css">
</head>
<body>
  <main class="pantalla">
    <header>
      <a class="volver" href="Niveles.html">← MAPA</a>
      <span id="estado" class="estado"></span>
    </header>
    <section class="intro">
      <p class="ceja" id="planeta"></p>
      <h1 id="titulo"></h1>
      <p id="descripcion"></p>
    </section>
    <section class="zona" id="zonaJuego">
      <div class="simulacion">
        <div class="hud-juego">
          <div class="medidor">
            <div class="medidor-encabezado"><strong>OXÍGENO</strong><span id="valorOxigeno">100%</span></div>
            <div class="medidor-fondo" role="progressbar" aria-label="Oxígeno disponible" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div id="barraOxigeno" class="medidor-valor oxigeno-valor"></div>
            </div>
          </div>
          <div class="medidor medidor-combustible">
            <div class="medidor-encabezado"><strong>COMBUSTIBLE NAVE</strong><span id="valorCombustible">100%</span></div>
            <div class="medidor-fondo" role="progressbar" aria-label="Combustible de la nave" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
              <div id="barraCombustible" class="medidor-valor combustible-valor"></div>
            </div>
          </div>
          <div class="datos-juego">
            <div class="vidas-hud"><strong>VIDAS</strong><span id="corazones" aria-label="3 vidas">♥ ♥ ♥</span></div>
            <span id="contadorOrbes" class="contador-orbes">0 / 0 orbes</span>
          </div>
        </div>
        <div id="jetpackPanel" class="jetpack-panel" hidden>
          <span>JETPACK</span>
          <div class="medidor-fondo" role="progressbar" aria-label="Carga del jetpack" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100">
            <div id="barraJetpack" class="medidor-valor jetpack-valor"></div>
          </div>
          <span id="valorJetpack">Buscá la mochila</span>
        </div>
        <canvas id="escena" tabindex="0" aria-label="Nivel de plataformas 2D. A y D para moverse; W o espacio para saltar."></canvas>
        <p id="formula"></p>
        <p id="ayudaControles" class="ayuda-controles">A / D: moverse · W o ESPACIO: saltar · Tocá las orbes O₂ para recargar · En Marte: J para usar el jetpack</p>
        <div id="estadoPlataforma" class="estado-plataforma">
          <p id="mensajePlataforma" aria-live="polite"></p>
          <div class="acciones-nivel">
            <button id="reintentar" class="siguiente secundario" hidden>REINTENTAR · 3 VIDAS</button>
            <button id="siguiente" class="siguiente" hidden>VOLVER AL MAPA →</button>
          </div>
        </div>
      </div>
    </section>
    <footer>Comandante: <span id="jugador"></span> · A/D para moverte, W o espacio para saltar.</footer>
  </main>
  <script src="../base-datos.js"></script>
  <script src="../Juego.js"></script>
</body>
</html>
