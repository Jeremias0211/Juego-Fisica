<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nuevo Hogar - Iniciar sesión</title>

    <link rel="stylesheet" href="../css/Login.css">
</head>

<body>

    <main class="login-container">

        <!-- LOGO -->

        <section class="logo">

            <div class="cohete">

                <img
                    src="../img/LogoEditado.png"
                    alt="Nuevo Hogar"
                >

            </div>

        </section>


        <!-- FORMULARIO -->

        <section class="formulario">

            <!-- USUARIO -->

            <div class="campo">

                <div class="icono">
                    👤
                </div>

                <input
                    type="text"
                    id="usuario"
                    placeholder="USUARIO"
                    autocomplete="username"
                >

            </div>


            <!-- CONTRASEÑA -->

            <div class="campo">

                <div class="icono">
                    🔒
                </div>

                <input
                    type="password"
                    id="contrasena"
                    placeholder="CONTRASEÑA"
                    autocomplete="current-password"
                >

            </div>


            <!-- INGRESAR -->

            <button
                class="btn-ingresar"
                id="btnIngresar"
                type="button">

                INGRESAR

            </button>


            <!-- SEPARADOR -->

            <div class="separador">

                <span>✦</span>

            </div>


            <!-- REGISTRO -->

            <div class="registro">

                <p>¿NO TENÉS CUENTA?</p>

                <button
                    id="btnRegistrarse"
                    type="button">

                    — REGISTRARSE —

                </button>

            </div>

        </section>

    </main>


    <script src="../Login.js"></script>

</body>

</html>
