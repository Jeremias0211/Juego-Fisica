    <title>Selección de niveles</title>

<body>

    <main class="mapa">

        <h1>SELECCIONÁ TU MISIÓN</h1>

        <div class="ruta"></div>


        <!-- NIVEL 1 -->

            <div class="planeta planeta1">🌎</div>

            <span>NIVEL 1</span>

        </button>


        <!-- NIVEL 2 -->

            <div class="candado">🔒</div>

        </button>


        <!-- NIVEL 3 -->

        </button>


        <!-- NIVEL 4 -->

            <div class="planeta planeta4">🔴</div>

            <span>NIVEL 4</span>
            <small>PLANETA ROJO</small>

            <div class="candado">🔒</div>

        </button>


        <!-- NIVEL 5 -->

            <div class="planeta planeta5">🟣</div>

            <span>NIVEL 5</span>

            <div class="candado">🔒</div>

        </button>


        <!-- NIVEL 6 -->

            <div class="planeta planeta6">🟢</div>

            <span>NIVEL 6</span>
            <small>PLANETA VERDE</small>

            <div class="candado">🔒</div>

        </button>
<!-- NIVEL 7 -->
<button class="nivel nivel7 bloqueado">

    <div class="planeta planeta7">🌕</div>

    <span>NIVEL 7</span>
    <small>LA LUNA PERDIDA</small>

</button>


<!-- NIVEL 8 -->
<button class="nivel nivel8 bloqueado">

    <div class="planeta planeta8">🌌</div>

    <span>NIVEL 8</span>

    <div class="candado">🔒</div>

</button>
