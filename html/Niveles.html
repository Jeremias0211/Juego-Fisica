<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Selección de niveles</title>

    <link rel="stylesheet" href="../css/Niveles.css">
</head>

<body>

    <main class="mapa">

        <h1>SELECCIONÁ TU MISIÓN</h1>
        <p id="progresoJugador" class="progreso-jugador"></p>

        <div class="ruta"></div>


        <!-- NIVEL 1 -->
        <button class="nivel nivel1" data-nivel="1">

            <div class="planeta planeta1">🪨</div>

            <span>NIVEL 1</span>
            <small>MERCURIO · IMPULSO</small>

        </button>


        <!-- NIVEL 2 -->
        <button class="nivel nivel2" data-nivel="2">

            <div class="planeta planeta2">🪐</div>

            <span>NIVEL 2</span>
            <small>VENUS · GRAVEDAD</small>

            <div class="candado">🔒</div>

        </button>


        <!-- NIVEL 3 -->
        <button class="nivel nivel3" data-nivel="3">

            <div class="planeta planeta3">🌑</div>

            <span>NIVEL 3</span>
            <small>TIERRA · INERCIA</small>

            <div class="candado">🔒</div>

        </button>


        <!-- NIVEL 4 -->
        <button class="nivel nivel4" data-nivel="4">

            <div class="planeta planeta4">🔴</div>

            <span>NIVEL 4</span>
            <small>MARTE · TRAYECTORIA</small>

            <div class="candado">🔒</div>

        </button>


        <!-- NIVEL 5 -->
        <button class="nivel nivel5" data-nivel="5">

            <div class="planeta planeta5">🟣</div>

            <span>NIVEL 5</span>
            <small>JÚPITER · ÓRBITAS</small>

            <div class="candado">🔒</div>

        </button>


        <!-- NIVEL 6 -->
        <button class="nivel nivel6" data-nivel="6">

            <div class="planeta planeta6">🟢</div>

            <span>NIVEL 6</span>
            <small>SATURNO · ENERGÍA</small>

            <div class="candado">🔒</div>

        </button>
<!-- NIVEL 7 -->
<button class="nivel nivel7 bloqueado" disabled>

    <div class="planeta planeta7">🌕</div>

    <span>NIVEL 7</span>
    <small>LA LUNA PERDIDA</small>

    <div class="candado">🔒</div>

</button>


<!-- NIVEL 8 -->
<button class="nivel nivel8 bloqueado" disabled>

    <div class="planeta planeta8">🌌</div>

    <span>NIVEL 8</span>
    <small>ÚLTIMO DESTINO</small>

    <div class="candado">🔒</div>

</button>



        <button class="volver" id="volver">
            &lt; VOLVER
        </button>

    </main>


    <script src="../base-datos.js"></script>
    <script src="../Niveles.js"></script>

</body>

</html>
